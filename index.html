<meta charset="UTF-8">
<title>点呼くん</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点呼くん">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/screens.css">

<div id="app">
  <div id="active-session-banner" class="active-session-banner hidden"></div>

  <main id="screen-root">
    <section id="screen-home" class="screen hidden"></section>
    <section id="screen-rosterList" class="screen hidden"></section>
    <section id="screen-childEdit" class="screen hidden"></section>
    <section id="screen-participantSelect" class="screen hidden"></section>
    <section id="screen-session" class="screen hidden"></section>
    <section id="screen-historyList" class="screen hidden"></section>
    <section id="screen-historyDetail" class="screen hidden"></section>
    <section id="screen-settings" class="screen hidden"></section>
  </main>

  <div id="overlay-root">
    <div id="overlay-unconfirmedWarning" class="overlay-sheet hidden"></div>
    <div id="overlay-addCheckpoint" class="overlay-sheet hidden"></div>
    <div id="overlay-exitSelect" class="overlay-sheet hidden"></div>
    <div id="overlay-exitReason" class="overlay-sheet hidden"></div>
    <div id="overlay-endSession" class="overlay-modal hidden"></div>
    <div id="overlay-resumeSession" class="overlay-modal hidden"></div>
    <div id="overlay-confirmDialog" class="overlay-modal hidden"></div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
</div>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="5 13 9 17 19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="icon-door-exit" viewBox="0 0 24 24"><rect x="4" y="3" width="10" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="13" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="17 8 21 12 17 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 22 20 2 20Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M12 3h6a2 2 0 0 1 2 2v6L11 20 3 12 3 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" transform="translate(-1 0)"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/></symbol>
  <symbol id="icon-download" viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="7 11 12 16 17 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="5" y1="20" x2="19" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24"><line x1="12" y1="16" x2="12" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="7 9 12 4 17 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="5" y1="20" x2="19" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<script type="module" src="js/main.js"></script>
